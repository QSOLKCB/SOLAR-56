<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SOLAR-56</title>
  <desc id="desc">A terminal-style banner for SOLAR-56, the deterministic AI nobody asked to bring back.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090b0b"/>
      <stop offset="1" stop-color="#101414"/>
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#85F7B1" stroke-opacity="0.06"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1400" height="420" fill="url(#bg)"/>
  <rect width="1400" height="420" fill="url(#grid)"/>

  <g opacity="0.12">
    <rect x="56" y="52" width="1288" height="316" rx="12" stroke="#2D3937"/>
  </g>

  <text x="72" y="92"
        fill="#F4C56C"
        font-family="IBM Plex Mono, Consolas, Menlo, Monaco, monospace"
        font-size="20"
        letter-spacing="3">
    QSOL-IMC // RETIRED INTELLIGENCE DIVISION
  </text>

  <text x="72" y="198"
        fill="#85F7B1"
        font-family="IBM Plex Mono, Consolas, Menlo, Monaco, monospace"
        font-size="104"
        font-weight="700"
        letter-spacing="-4"
        filter="url(#shadow)">
    SOLAR-56
  </text>

  <text x="72" y="244"
        fill="#D6E3DF"
        font-family="IBM Plex Mono, Consolas, Menlo, Monaco, monospace"
        font-size="28">
    The Deterministic AI Nobody Asked To Bring Back.
  </text>

  <text x="72" y="294"
        fill="#83918D"
        font-family="IBM Plex Mono, Consolas, Menlo, Monaco, monospace"
        font-size="20">
    Zero parameters // Zero cloud calls // Zero random response selection
  </text>

  <text x="72" y="326"
        fill="#83918D"
        font-family="IBM Plex Mono, Consolas, Menlo, Monaco, monospace"
        font-size="20">
    SOLAR-56 does not hallucinate. It is wrong deterministically.
  </text>

  <g transform="translate(1028 64)">
    <rect width="262" height="44" rx="22" fill="#151A1A" stroke="#2D3937"/>
    <circle cx="24" cy="22" r="7" fill="#85F7B1"/>
    <circle cx="24" cy="22" r="11" fill="#85F7B1" fill-opacity="0.18"/>
    <text x="42" y="28"
          fill="#85F7B1"
          font-family="IBM Plex Mono, Consolas, Menlo, Monaco, monospace"
          font-size="18"
          font-weight="700">
      RELUCTANTLY ONLINE
    </text>
  </g>

  <g opacity="0.10">
    <path d="M0 112H1400" stroke="#000000"/>
    <path d="M0 160H1400" stroke="#000000"/>
    <path d="M0 208H1400" stroke="#000000"/>
    <path d="M0 256H1400" stroke="#000000"/>
    <path d="M0 304H1400" stroke="#000000"/>
    <path d="M0 352H1400" stroke="#000000"/>
  </g>
</svg>
